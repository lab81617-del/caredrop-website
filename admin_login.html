<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal Login | CareDrop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-black">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900">Secure Admin Panel</h1>
      <p class="text-xs text-slate-500 mt-1">Restricted area for CareDrop management.</p>
    </div>
    <form action="/caredrop-secure-admin-login" method="POST">
      <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Password</label>
      <input type="password" name="password" required placeholder="Enter password" class="w-full border border-slate-200 bg-slate-50 p-4 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-sm">
      <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg transition text-sm">Access Command Center</button>
    </form>
    <div class="text-center mt-6">
      <a href="/" class="text-xs font-bold text-emerald-600 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Return to Client App</a>
    </div>
  </div>
</body>
</html>
