<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Reports | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#0d9488' }, navy: { 900: '#0b192c' } } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-center gap-3">
        <a href="/" class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow-sm">
            <i class="fa-solid fa-plus text-sm"></i>
        </a>
        <span class="text-lg font-black tracking-tight text-navy-900 block leading-none">CareDrop</span>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-50 rounded-full blur-2xl z-0"></div>
            
            <div class="relative z-10 text-center mb-8">
                <h1 class="text-2xl font-black text-navy-900 mb-1">Access Reports</h1>
                <p class="text-xs text-slate-500">Log in with the email used during booking.</p>
            </div>

            <!-- Flash Errors -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="bg-red-50 text-red-600 text-xs font-bold px-4 py-3 rounded-lg mb-4 text-center">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <div id="step-1">
                <input type="email" id="email_input" placeholder="Patient Email Address" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-center outline-none focus:ring-2 focus:ring-brand-600 mb-4">
                <button type="button" onclick="sendOTP()" id="send-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-sm uppercase tracking-wider">
                    Send Login Code
                </button>
            </div>

            <form id="step-2" action="/api/verify_login_otp" method="POST" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Enter 4-Digit Code</label>
                    <button type="button" onclick="editEmail()" class="text-[10px] text-brand-600 hover:underline font-bold">Change Email</button>
                </div>
                <input type="text" name="otp" required maxlength="4" placeholder="••••" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl text-2xl tracking-[1em] font-black text-center outline-none focus:ring-2 focus:ring-brand-600 mb-6">
                <button type="submit" class="w-full bg-navy-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-sm uppercase tracking-wider">
                    Verify & Enter
                </button>
            </form>
        </div>
    </main>

    <script>
        async function sendOTP() {
            const email = document.getElementById('email_input').value;
            if(!email) return alert('Please enter your email.');
            
            const btn = document.getElementById('send-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            
            const formData = new FormData();
            formData.append('email', email);

            try {
                await fetch('/api/send_login_otp', { method: 'POST', body: formData });
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
            } catch (e) {
                alert("Failed to send OTP.");
            } finally {
                btn.innerHTML = 'Send Login Code';
            }
        }
        function editEmail() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }
    </script>
</body>
</html>
