<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 50: '#E1F6F6', 500: '#00A8A8', 600: '#008F8F' }, navy: { 900: '#0B192C' } } } }
        }
    </script>
</head>
<body class="bg-[#F8F9FA] flex flex-col items-center justify-center min-h-screen p-4 font-sans antialiased">
    
    <a href="/" class="mb-8 flex items-center gap-2">
        <div class="w-10 h-10 bg-brand-500 text-white rounded-xl flex items-center justify-center text-2xl transform -rotate-6 shadow-sm"><i class="fa-solid fa-notes-medical"></i></div>
        <span class="text-2xl font-black text-navy-900 tracking-tight">CareDrop</span>
    </a>

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md">
        
        <!-- Step 1: Email Input -->
        <div id="email-step">
            <h2 class="text-2xl font-black text-navy-900 mb-2">Access Your Reports</h2>
            <p class="text-sm text-slate-500 font-medium mb-6">Enter the email address you used during booking to download your diagnostic reports.</p>
            
            <form id="sendOtpForm" class="space-y-4" onsubmit="sendOtp(event, false)">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Email Address</label>
                    <input type="email" id="login_email" required class="w-full border border-slate-300 px-4 py-3 rounded-xl focus:outline-none focus:border-brand-500 text-sm" placeholder="name@example.com">
                </div>
                <button type="submit" id="sendBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                    Send Login Code <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="otp-step" class="hidden text-center">
            <div class="flex justify-start">
                <button onclick="backToEmail()" class="text-slate-400 hover:text-brand-500 text-sm font-bold mb-4 flex items-center gap-1 transition"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>
            
            <div class="w-16 h-16 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <h2 class="text-2xl font-black text-navy-900 mb-2">Verify your Email</h2>
            <p class="text-sm text-slate-500 font-medium mb-6">We sent a 4-digit code to <br><span id="display_email" class="font-bold text-navy-900"></span>.</p>
            
            <form action="/api/verify_login_otp" method="POST" class="space-y-4">
                <input type="text" name="otp" maxlength="4" required class="w-full text-center text-4xl tracking-[0.5em] font-black border-b-2 border-slate-300 pb-2 focus:outline-none focus:border-brand-500 bg-transparent text-navy-900 placeholder-slate-200" placeholder="••••">
                
                <!-- Timer and Resend -->
                <div class="h-6 flex items-center justify-center mt-4">
                    <p id="timerText" class="text-xs text-slate-400 font-bold">Resend OTP in <span id="countdown" class="text-navy-900">60</span>s</p>
                    <button id="resendBtn" type="button" onclick="sendOtp(event, true)" class="hidden text-brand-600 hover:text-brand-800 text-xs font-black underline">Resend OTP Now</button>
                </div>

                <button type="submit" class="w-full bg-navy-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-md mt-2">
                    Verify & Login
                </button>
            </form>
        </div>
    </div>

    <script>
        let timerInterval;

        function startTimer() {
            let timeLeft = 60;
            document.getElementById('resendBtn').classList.add('hidden');
            document.getElementById('timerText').classList.remove('hidden');
            document.getElementById('countdown').innerText = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerText').classList.add('hidden');
                    document.getElementById('resendBtn').classList.remove('hidden');
                }
            }, 1000);
        }

        async function sendOtp(e, isResend = false) {
            if(e) e.preventDefault();
            const email = document.getElementById('login_email').value;
            const btn = isResend ? document.getElementById('resendBtn') : document.getElementById('sendBtn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = isResend ? 'Sending...' : '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('email', email);

            try {
                const res = await fetch('/api/send_login_otp', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.status === 'success') {
                    document.getElementById('email-step').classList.add('hidden');
                    document.getElementById('otp-step').classList.remove('hidden');
                    document.getElementById('display_email').innerText = email;
                    
                    if(isResend) {
                        alert("New OTP sent! Please check your inbox and spam folder.");
                    }
                    startTimer();
                }
            } catch (error) {
                console.error(error);
                alert("Failed to send OTP.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function backToEmail() {
            document.getElementById('otp-step').classList.add('hidden');
            document.getElementById('email-step').classList.remove('hidden');
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
