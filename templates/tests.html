<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book a Test | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#E6F8F8', 500: '#00B4B6', 600: '#009092', 900: '#003637' } }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-[#F8FBFB] text-slate-900 font-sans antialiased pb-28 md:pb-12">

    <!-- Top Navigation (Desktop) -->
    <header class="bg-white sticky top-0 z-40 shadow-[0_2px_10px_rgba(0,0,0,0.03)] hidden md:block">
        <div class="max-w-7xl mx-auto px-8 h-[72px] flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-brand-500 flex items-center justify-center text-white"><i class="fa-solid fa-droplet text-sm"></i></div>
                <span class="text-2xl font-bold tracking-tight text-slate-900">CareDrop</span>
            </a>
            <div class="flex items-center gap-8 font-semibold text-sm text-slate-600">
                <a href="/tests" class="text-brand-500">Tests</a>
                <a href="#" class="hover:text-brand-500 transition">Packages</a>
                <a href="#" class="hover:text-brand-500 transition">About</a>
                <a href="#" class="hover:text-brand-500 transition">Contact</a>
            </div>
            <a href="/login" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2 rounded-full font-semibold transition shadow-sm text-sm">Login</a>
        </div>
    </header>

    <!-- Mobile Header -->
    <header class="md:hidden bg-white sticky top-0 z-40 px-4 h-16 flex items-center gap-3 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
        <a href="/" class="text-slate-500 text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-50"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-lg font-bold tracking-tight text-slate-900">Book a Test</h1>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 md:py-8">
        
        <h1 class="hidden md:block text-3xl font-extrabold text-slate-900 tracking-tight mb-6">Book a Test</h1>
        
        <!-- Live Search Bar -->
        <div class="bg-white p-1.5 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] flex items-center border border-slate-100 mb-6 relative z-10">
            <div class="pl-4 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></div>
            <input type="text" id="searchInput" onkeyup="filterTests()" placeholder="Search tests or packages..." class="w-full pl-3 pr-4 py-3 bg-transparent outline-none text-slate-700 font-medium text-sm">
        </div>

        <!-- Figma Filter Pills -->
        <div class="flex gap-2.5 overflow-x-auto pb-2 hide-scrollbar mb-6">
            <button class="bg-brand-500 text-white px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap shadow-sm">All</button>
            <button class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap transition">Blood</button>
            <button class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap transition">Liver</button>
            <button class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap transition">Kidney</button>
            <button class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap transition">Thyroid</button>
            <button class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-full font-semibold text-xs whitespace-nowrap transition">Others</button>
        </div>

        <!-- Test List Container -->
        <div class="space-y-4" id="test-list">
            {% for t in tests %}
            <div class="test-card bg-white p-5 rounded-2xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition flex justify-between items-center" data-name="{{ t.name | lower }}">
                <div class="pr-4">
                    <h3 class="font-bold text-base md:text-lg text-slate-900 mb-0.5">{{ t.name }}</h3>
                    <p class="text-[11px] text-slate-500 font-medium mb-3">{{ t.category }} Panel</p>
                    <div class="flex items-center gap-3">
                        <span class="block text-xl md:text-2xl font-extrabold text-slate-900 leading-none">₹{{ t.price|int }}</span>
                        <span class="text-[9px] text-emerald-600 font-bold bg-emerald-50 px-1.5 py-0.5 rounded flex items-center gap-1 mt-1 md:mt-0"><i class="fa-regular fa-clock"></i> Same day report</span>
                    </div>
                </div>
                <button onclick="addToCart({{ t.id }}, {{ t.price }}, this)" class="bg-brand-50 text-brand-600 hover:bg-brand-500 hover:text-white px-5 py-2 md:px-6 md:py-2.5 rounded-xl font-bold transition text-xs md:text-sm shrink-0 shadow-sm">
                    Add
                </button>
            </div>
            {% else %}
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-vial text-4xl mb-3"></i>
                <p class="font-semibold text-sm">No tests found for this search.</p>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Floating Cart Bar (Hidden until a test is added) -->
    <div id="floating-cart" class="fixed bottom-[80px] md:bottom-6 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[600px] bg-brand-900 text-white rounded-2xl px-6 py-4 justify-between items-center shadow-[0_10px_40px_rgba(0,54,55,0.4)] z-50 hidden transition-all duration-300">
        <div>
            <span id="cart-count" class="block text-xs text-brand-100 font-semibold mb-0.5">1 test selected</span>
            <span id="cart-total" class="block text-lg md:text-xl font-black leading-none">₹0</span>
        </div>
        <a href="/checkout" class="bg-white text-brand-900 hover:bg-brand-50 px-6 py-3 rounded-xl font-extrabold text-xs md:text-sm transition shadow-md flex items-center gap-2">
            View Cart <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <!-- Mobile Bottom Navigation Bar (Figma Exact) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-[68px] z-40 px-2 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
        <a href="/" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900 transition">
            <i class="fa-solid fa-house text-[18px]"></i>
            <span class="text-[10px] font-bold">Home</span>
        </a>
        <a href="/tests" class="flex flex-col items-center gap-1 text-brand-500">
            <i class="fa-solid fa-magnifying-glass text-[18px]"></i>
            <span class="text-[10px] font-bold">Search</span>
        </a>
        <a href="/checkout" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900 transition relative">
            <i class="fa-solid fa-cart-shopping text-[18px]"></i>
            <span class="text-[10px] font-bold">Cart</span>
        </a>
        <a href="/login" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900 transition">
            <i class="fa-regular fa-user text-[18px]"></i>
            <span class="text-[10px] font-bold">User</span>
        </a>
    </div>

    <script>
        let cartTotal = 0;
        let cartCount = 0;

        function filterTests() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('test-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        async function addToCart(testId, price, btnElement) {
            try {
                // Call API without reloading the page
                const res = await fetch(`/api/cart/add/${testId}`, { method: 'POST' });
                const data = await res.json();
                
                if (data.status === 'success') {
                    // Update Button Visuals
                    btnElement.innerHTML = '<i class="fa-solid fa-check"></i> Added';
                    btnElement.classList.remove('bg-brand-50', 'text-brand-600', 'hover:bg-brand-500', 'hover:text-white');
                    btnElement.classList.add('bg-emerald-500', 'text-white');
                    btnElement.disabled = true;

                    // Calculate and Show Cart Bar
                    cartCount++;
                    cartTotal += parseFloat(price);
                    
                    document.getElementById('cart-count').innerText = `${cartCount} test${cartCount > 1 ? 's' : ''} selected`;
                    document.getElementById('cart-total').innerText = `₹${cartTotal}`;
                    
                    const floatingCart = document.getElementById('floating-cart');
                    floatingCart.classList.remove('hidden');
                    floatingCart.classList.add('flex');
                }
            } catch (e) {
                console.error("Cart error", e);
            }
        }
    </script>
</body>
</html>
