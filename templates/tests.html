<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book a Test | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#E6F8F8', 500: '#00B4B6', 600: '#009092', 900: '#003637' } }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F8FBFB] text-slate-900 font-sans antialiased pb-28 md:pb-12">

    <!-- Desktop Navigation -->
    <header class="bg-white sticky top-0 z-40 shadow-[0_2px_10px_rgba(0,0,0,0.03)] hidden md:block">
        <div class="max-w-7xl mx-auto px-8 h-[72px] flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-brand-500 flex items-center justify-center text-white"><i class="fa-solid fa-droplet text-sm"></i></div>
                <span class="text-[22px] font-bold tracking-tight text-slate-900">CareDrop</span>
            </a>
            <a href="/checkout" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded-full font-bold transition text-sm flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> Checkout
            </a>
        </div>
    </header>

    <!-- Mobile Header -->
    <header class="md:hidden bg-white sticky top-0 z-40 px-4 h-16 flex items-center gap-3 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
        <a href="/" class="text-slate-500 text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-50"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-lg font-bold tracking-tight text-slate-900">Book a Test</h1>
    </header>

    <main class="max-w-[700px] mx-auto px-4 py-6 md:py-8">
        
        <h1 class="hidden md:block text-3xl font-extrabold text-slate-900 tracking-tight mb-6">Book a Test</h1>
        
        <!-- Search Bar -->
        <div class="bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 mb-6 flex items-center">
            <div class="pl-4 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></div>
            <input type="text" id="searchInput" onkeyup="filterTests()" placeholder="Search tests or packages..." class="w-full pl-3 pr-4 py-3 bg-transparent outline-none text-slate-700 font-semibold text-sm">
        </div>

        <!-- Dynamic Test List -->
        <div class="space-y-4" id="test-list">
            {% for t in tests %}
            <div class="test-card bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center" data-name="{{ t.name | lower }}" data-category="{{ t.category | lower }}">
                <div class="pr-4">
                    <h3 class="font-bold text-[17px] md:text-lg text-slate-900 mb-1">{{ t.name }}</h3>
                    <p class="text-[11px] text-slate-500 font-medium mb-3">{{ t.category }} Panel</p>
                    <div class="flex items-center gap-3">
                        <span class="block text-xl md:text-2xl font-extrabold text-slate-900 leading-none">₹{{ t.price|int }}</span>
                        <span class="text-[9px] text-emerald-600 font-bold bg-emerald-50 px-1.5 py-0.5 rounded flex items-center gap-1 mt-1 md:mt-0"><i class="fa-regular fa-clock"></i> Same day report</span>
                    </div>
                </div>
                <button onclick="addToCart({{ t.id }}, {{ t.price }}, this)" class="bg-brand-50 text-brand-600 hover:bg-brand-500 hover:text-white px-5 py-2.5 md:px-6 rounded-xl font-bold transition text-xs md:text-sm shrink-0">
                    Add
                </button>
            </div>
            {% else %}
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-flask text-4xl mb-3"></i>
                <p class="font-semibold text-sm">No tests found in catalog.</p>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="floating-cart" class="fixed bottom-[80px] md:bottom-6 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[600px] bg-slate-900 text-white rounded-2xl px-6 py-4 justify-between items-center shadow-xl z-50 hidden transition-all duration-300">
        <div>
            <span id="cart-count" class="block text-[11px] text-slate-300 font-semibold mb-0.5 uppercase tracking-wider">1 item</span>
            <span id="cart-total" class="block text-[22px] font-extrabold text-brand-500 leading-none">₹0</span>
        </div>
        <a href="/checkout" class="bg-brand-500 text-white hover:bg-brand-600 px-6 py-3 rounded-xl font-bold text-sm transition shadow-md flex items-center gap-2">
            Checkout <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <!-- Mobile Nav -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-[68px] z-40 px-2 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
        <a href="/" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[10px] font-bold">Home</span></a>
        <a href="/tests" class="flex flex-col items-center gap-1 text-brand-500"><i class="fa-solid fa-magnifying-glass text-[18px]"></i><span class="text-[10px] font-bold">Search</span></a>
        <a href="/checkout" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-solid fa-cart-shopping text-[18px]"></i><span class="text-[10px] font-bold">Cart</span></a>
        <a href="/login" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-regular fa-user text-[18px]"></i><span class="text-[10px] font-bold">User</span></a>
    </div>

    <script>
        let cartTotal = 0;
        let cartCount = 0;

        function filterTests() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('test-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                let cat = cards[i].getAttribute('data-category');
                if (name.includes(input) || cat.includes(input)) cards[i].style.display = "flex";
                else cards[i].style.display = "none";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const q = new URLSearchParams(window.location.search).get('q');
            if(q) { document.getElementById('searchInput').value = q; filterTests(); }
        });

        async function addToCart(testId, price, btnElement) {
            try {
                const res = await fetch(`/api/cart/add/${testId}`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    btnElement.innerHTML = '<i class="fa-solid fa-check"></i> Added';
                    btnElement.classList.replace('bg-brand-50', 'bg-emerald-500');
                    btnElement.classList.replace('text-brand-600', 'text-white');
                    btnElement.disabled = true;

                    cartCount++; cartTotal += parseFloat(price);
                    document.getElementById('cart-count').innerText = `${cartCount} item${cartCount > 1 ? 's' : ''}`;
                    document.getElementById('cart-total').innerText = `₹${cartTotal}`;
                    
                    const floatingCart = document.getElementById('floating-cart');
                    floatingCart.classList.remove('hidden');
                    floatingCart.classList.add('flex');
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
