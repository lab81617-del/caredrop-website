<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HQ Access | CareDrop Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 600: '#0d9488' }, navy: { 900: '#0b192c', 950: '#060d17' } } } }
        }
    </script>
</head>
<body class="bg-navy-950 text-slate-300 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-600 selection:text-white">

    <main class="flex-1 flex items-center justify-center p-4 relative overflow-hidden">
        
        <!-- Tech Background Pattern -->
        <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#0d9488 1px, transparent 1px); background-size: 30px 30px;"></div>

        <div class="w-full max-w-sm bg-navy-900 rounded-3xl shadow-2xl border border-slate-800 p-8 relative z-10">
            
            <!-- Flash Error Messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="bg-red-900/50 border border-red-500/50 text-red-200 text-xs font-bold px-4 py-3 rounded-xl mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <div class="flex flex-col items-center mb-8">
                <div class="w-12 h-12 rounded-xl bg-brand-600 flex items-center justify-center text-white text-xl shadow-[0_0_15px_rgba(13,148,136,0.5)] mb-4">
                    <i class="fa-solid fa-fingerprint"></i>
                </div>
                <h1 class="text-xl font-black text-white tracking-wider uppercase">HQ Access</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Authorized Personnel Only</p>
            </div>

            <form action="/hq/login" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Clearance Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-4 top-3.5 text-slate-500"></i>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-navy-950 border border-slate-700 rounded-xl text-sm text-white font-mono focus:border-brand-600 focus:ring-1 focus:ring-brand-600 outline-none transition placeholder-slate-600 shadow-inner">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-black py-3.5 rounded-xl shadow-[0_4px_14px_0_rgba(13,148,136,0.39)] transition-all text-sm uppercase tracking-wider active:scale-95">
                    Initialize System
                </button>
            </form>
            
            <div class="mt-8 pt-4 border-t border-slate-800 text-center">
                <p class="text-[8px] text-slate-500 uppercase tracking-widest">CareDrop Dispatch & LIMS Architecture</p>
            </div>
        </div>
    </main>
</body>
</html>
