<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Logistics | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#0d9488' }, navy: { 900: '#0b192c' } } } } }
    </script>
</head>
<body class="bg-navy-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="px-4 py-4 flex items-center justify-between z-10 bg-navy-950 border-b border-slate-800 shadow-md">
        <a href="/rider" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <span class="text-sm font-black tracking-widest uppercase">Link Specimen</span>
        <div class="w-10 h-10"></div>
    </header>

    <main class="flex-1 flex flex-col">
        
        <!-- Camera Viewfinder -->
        <div class="bg-black relative h-64 flex items-center justify-center border-b-4 border-brand-600">
            <div id="reader" class="w-full h-full object-cover"></div>
            <div id="camera-error" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-slate-900 hidden">
                <i class="fa-solid fa-camera-rotate text-3xl text-slate-500 mb-2"></i>
                <p class="text-xs font-bold text-slate-400">Camera blocked or unavailable.<br>Please enter sticker number manually below.</p>
            </div>
        </div>

        <!-- Action Panel -->
        <div class="flex-1 bg-slate-100 rounded-t-3xl -mt-4 text-slate-800 p-6 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.2)]">
            <h3 class="text-sm font-black text-navy-900 uppercase tracking-wider mb-4 border-b border-slate-200 pb-2"><i class="fa-solid fa-barcode mr-2 text-brand-600"></i>Log Collection</h3>
            
            <form action="/api/rider/complete" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Specimen Barcode / Sticker No.</label>
                    <input type="text" name="barcode" id="barcode-input" required placeholder="Scan or Type Number..." class="w-full px-4 py-3 bg-white border-2 border-slate-300 rounded-xl text-lg font-mono font-black text-brand-700 focus:border-brand-600 outline-none uppercase transition">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Patient Order</label>
                    <select name="order_id" required class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-bold text-navy-900 focus:ring-2 focus:ring-brand-600 outline-none">
                        <option value="" disabled selected>-- Select Pending Order --</option>
                        {% for o in orders %}
                        <option value="{{ o.id }}">{{ o.order_code }} - {{ o.full_name }} ({{ o.age }} {{ o.gender }})</option>
                        {% else %}
                        <option value="" disabled>No pending orders assigned to you.</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Transport Temp</label>
                        <select name="temperature" class="w-full px-3 py-3 bg-white border border-slate-300 rounded-xl text-xs font-bold text-slate-700 outline-none">
                            <option value="2-8°C (Optimal)">2-8°C (Cold Chain)</option>
                            <option value="Ambient">Ambient</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Payment Collected</label>
                        <select name="payment_mode" class="w-full px-3 py-3 bg-white border border-slate-300 rounded-xl text-xs font-bold text-slate-700 outline-none">
                            <option value="Cash">Cash Collected</option>
                            <option value="UPI">UPI / Online</option>
                            <option value="Unpaid">Left Unpaid</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-navy-900 hover:bg-slate-800 text-white font-black py-4 rounded-xl shadow-md active:scale-95 transition-all text-sm uppercase tracking-widest mt-4">
                    <i class="fa-solid fa-link mr-1"></i> Link Specimen
                </button>
            </form>
        </div>
    </main>

    <script>
        function onScanSuccess(decodedText) {
            document.getElementById('barcode-input').value = decodedText;
            if (navigator.vibrate) navigator.vibrate(200);
            document.getElementById('barcode-input').classList.add('bg-emerald-50', 'border-emerald-500');
        }

        function onScanFailure(error) {
            // Suppress frame errors
        }

        try {
            let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100}, aspectRatio: 1.0 }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        } catch (e) {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('camera-error').classList.remove('hidden');
        }
    </script>
</body>
</html>
