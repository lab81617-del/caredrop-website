<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Login | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 50: '#E1F6F6', 500: '#00A8A8', 600: '#008F8F' }, navy: { 800: '#1A2938', 900: '#0B192C' } } } } }
    </script>
</head>
<body class="bg-[#F8F9FA] text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative">
    
    <!-- Faded Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute -top-[20%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-brand-500/10 blur-3xl"></div>
        <div class="absolute -bottom-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-navy-900/5 blur-3xl"></div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 sm:p-10 border border-slate-100 relative z-10">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-brand-500 text-white rounded-xl mx-auto flex items-center justify-center text-3xl transform -rotate-6 shadow-sm mb-5"><i class="fa-solid fa-notes-medical"></i></div>
            <h2 class="text-2xl font-black text-navy-900 tracking-tight">Partner Portal</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Log in to manage your clinic's dashboard.</p>
        </div>
        
        <!-- Error Messages (Invalid Login) -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-6 p-4 bg-rose-50 border border-rose-200 text-rose-600 text-sm font-bold rounded-xl text-center flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form action="/partner/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Partner ID / Promo Code</label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" name="referral_code" required class="w-full border border-slate-300 pl-10 pr-4 py-3.5 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-slate-50 uppercase placeholder-slate-400 transition" placeholder="e.g. PT-1234">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" name="password" required class="w-full border border-slate-300 pl-10 pr-4 py-3.5 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-slate-50 placeholder-slate-400 transition" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full bg-navy-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-lg mt-2 flex items-center justify-center gap-2">
                Secure Login <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400 font-medium">Not registered yet? <a href="https://wa.me/{{ site_settings.phone|replace(' ', '')|replace('+', '') }}" class="text-brand-500 font-bold hover:underline">Contact CareDrop HQ</a></p>
        </div>
        
    </div>
</body>
</html>
