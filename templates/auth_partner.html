<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Partner Login | CareDrop Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#f0fdfa', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' }, navy: { 900: '#0b192c', 950: '#060d17' } } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-center gap-3 shadow-sm z-10">
        <div class="w-8 h-8 rounded-lg bg-navy-900 flex items-center justify-center text-white shadow-sm">
            <i class="fa-solid fa-stethoscope text-sm"></i>
        </div>
        <span class="text-lg font-black tracking-tight text-navy-900 block leading-none">CareDrop Partner Network</span>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 relative overflow-hidden">
            
            <!-- Flash Error Messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="bg-red-50 border border-red-200 text-red-600 text-xs font-bold px-4 py-3 rounded-xl mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-base"></i>
                    {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-navy-900 mb-1">Clinic Portal</h1>
                <p class="text-xs text-slate-500">Log in to manage your referrals and commissions.</p>
            </div>

            <form action="/partner/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Partner Referral Code</label>
                    <div class="relative">
                        <i class="fa-solid fa-hashtag absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" name="referral_code" required placeholder="e.g. CITYMED" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold uppercase focus:ring-2 focus:ring-brand-600 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Secure Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-brand-600 outline-none transition">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-navy-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-sm tracking-wide mt-2">
                    Access Dashboard <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
                </button>
            </form>
            
            <p class="text-center text-[10px] text-slate-400 mt-6">
                Need to register your clinic? <a href="mailto:caredrop.ynr@gmail.com" class="font-bold text-brand-600 hover:underline">Contact Support</a>
            </p>
        </div>
    </main>
</body>
</html>
