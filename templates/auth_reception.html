<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception Login | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { 50: '#E1F6F6', 500: '#00A8A8', 600: '#008F8F' }, navy: { 900: '#0B192C' } } } } }
    </script>
</head>
<body class="bg-[#F8F9FA] flex items-center justify-center min-h-screen p-4 font-sans antialiased">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-sm text-center">
        <div class="w-12 h-12 bg-brand-50 text-brand-500 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4 transform -rotate-6"><i class="fa-solid fa-notes-medical"></i></div>
        <h2 class="text-xl font-black text-navy-900 mb-1">CareDrop Workspace</h2>
        <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-6">Reception Portal</p>
        
        <form method="POST" class="space-y-4">
            <div>
                <input type="password" name="password" required class="w-full border border-slate-300 px-4 py-3 rounded-xl focus:outline-none focus:brand-500 text-sm text-center" placeholder="Enter Passcode">
            </div>
            <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl transition shadow-md">
                Secure Login
            </button>
        </form>
    </div>
</body>
</html>
