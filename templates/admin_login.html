<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 py-4 px-6">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="/" class="text-xs font-bold text-slate-600 hover:text-slate-900"><i class="fa-solid fa-arrow-left mr-2"></i> Home</a>
            <span class="text-xs font-bold text-slate-400">Restricted Area</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 w-full">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Administrator Portal</h2>
                <p class="text-xs text-slate-500 mt-1">Enter credentials to manage clinical records.</p>
            </div>

            {% if error %}
            <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold rounded-xl text-center">
                {{ error }}
            </div>
            {% endif %}

            <form action="/admin-login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Username</label>
                    <input type="text" name="username" required placeholder="admin" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-900">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="caredrop123" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-900">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md mt-2">
                    Access Console
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 CareDrop Diagnostics Core System.</p>
    </footer>

</body>
</html>
