<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Sample Collection | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 py-4 px-6">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <a href="/" class="text-sm font-bold text-slate-600 hover:text-slate-900"><i class="fa-solid fa-arrow-left mr-2"></i> Back to Tests</a>
            <span class="text-sm font-extrabold text-slate-900">CareDrop Secure Booking</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 py-12 w-full">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
            <div class="mb-6 pb-6 border-b border-slate-100">
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-sky-600 bg-sky-50 px-3 py-1 rounded-full border border-sky-100">{{ test['category'] }}</span>
                <h2 class="text-2xl font-extrabold text-slate-900 mt-2">{{ test['name'] }}</h2>
                <p class="text-lg font-bold text-slate-700 mt-1">Price: ₹{{ test['price'] }}</p>
            </div>

            <form action="/book" method="POST" class="space-y-4">
                <input type="hidden" name="test_id" value="{{ test['id'] }}">
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Patient Full Name</label>
                    <input type="text" name="patient_name" required placeholder="Enter full name" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-600">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Phone Number</label>
                    <input type="tel" name="phone" required placeholder="10-digit mobile number" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-600">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Collection Address</label>
                    <textarea name="address" required rows="3" placeholder="Enter complete address for sample pickup" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-600"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Preferred Date & Time</label>
                    <input type="date" name="date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-600">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md mt-4">
                    Confirm Home Collection Booking
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 CareDrop Diagnostics Core System.</p>
    </footer>

</body>
</html>
