<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareDrop | Home Blood Testing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">
                <i class="fa-solid fa-droplet text-red-400 mr-2"></i>CareDrop
            </h1>
            <a href="/dashboard" class="text-xs bg-blue-700 px-3 py-1.5 rounded-full shadow-inner border border-blue-500 font-medium">Staff Login</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 mt-2">
        
        <!-- Trust Banner -->
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 mb-6 flex items-center shadow-sm">
            <i class="fa-solid fa-truck-medical text-blue-500 text-xl mr-3"></i>
            <p class="text-sm text-blue-800 font-medium">Fast home sample collection across Yamunanagar.</p>
        </div>

        <!-- Booking Form -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-gray-100">
            <h2 class="text-xl font-bold mb-1">Book a Test</h2>
            <p class="text-gray-500 text-sm mb-6">Verified phlebotomists. NABL accurate reports.</p>
            
            <form action="/book_test" method="POST" class="space-y-4">
                
                <!-- Patient Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Patient Name</label>
                    <input type="text" name="full_name" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white" 
                        placeholder="e.g. Rahul Sharma">
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
                    <input type="tel" name="phone" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white" 
                        placeholder="10-digit mobile number">
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Home Address</label>
                    <textarea name="address" rows="2" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white" 
                        placeholder="House No, Sector/Colony, Yamunanagar"></textarea>
                </div>

                <!-- Tests Required -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tests Required</label>
                    <input type="text" name="tests_requested" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white" 
                        placeholder="e.g. CBC, LFT, or Type 'Call Me'">
                    <p class="text-xs text-gray-400 mt-1">Not sure? Just write "Call Me" and we will guide you.</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition-transform transform active:scale-95 flex justify-center items-center mt-2">
                    Book Collection <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>

    </main>

</body>
</html>
