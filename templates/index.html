<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CareDrop | Premium Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Smooth modal animation */
        #checkout-modal { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-hidden { transform: translateY(100%); }
        .modal-visible { transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">

    <!-- App Header -->
    <header class="bg-white sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-droplet text-blue-600 text-xl"></i>
            <span class="text-xl font-extrabold tracking-tight text-gray-900">CareDrop</span>
        </div>
        <a href="/dashboard" class="text-xs font-semibold bg-gray-100 text-gray-600 px-3 py-1.5 rounded-full">Staff</a>
    </header>

    <!-- Main App Content -->
    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- Search Bar (UI only for now) -->
        <div class="relative mb-6 shadow-sm">
            <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" placeholder="Search for tests or profiles..." 
                class="w-full bg-white border border-gray-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium">
        </div>

        <h2 class="text-lg font-bold text-gray-900 mb-3">Popular Tests</h2>

        <!-- Dynamic Test List Container -->
        <div id="test-list" class="space-y-3">
            <!-- Tests injected by JavaScript here -->
        </div>

    </main>

    <!-- Floating Cart Bottom Bar (Like Swiggy/Zomato) -->
    <div id="bottom-bar" class="fixed bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 bg-white border-t border-gray-200 p-3 z-40 hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="flex justify-between items-center bg-blue-600 text-white rounded-xl p-3 shadow-lg cursor-pointer" onclick="openCheckout()">
            <div>
                <p class="text-xs text-blue-100 font-medium uppercase tracking-wide"><span id="cart-count">0</span> Tests Added</p>
                <p class="text-lg font-bold">₹<span id="cart-total">0</span></p>
            </div>
            <div class="font-bold flex items-center">
                Proceed to Checkout <i class="fa-solid fa-chevron-right ml-2 text-sm"></i>
            </div>
        </div>
    </div>

    <!-- Slide-Up Checkout Modal -->
    <div id="checkout-overlay" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity duration-300"></div>
    <div id="checkout-modal" class="fixed bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 bg-white rounded-t-3xl z-50 modal-hidden shadow-2xl h-[85vh] flex flex-col">
        
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-5 border-b border-gray-100">
            <h3 class="text-lg font-bold text-gray-900">Patient Details</h3>
            <button onclick="closeCheckout()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Checkout Form -->
        <div class="overflow-y-auto p-5 flex-1">
            
            <!-- Cart Summary in Modal -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">
                <h4 class="text-sm font-bold text-blue-900 mb-2">Order Summary</h4>
                <div id="modal-cart-items" class="text-sm text-blue-800 font-medium mb-2 space-y-1"></div>
                <div class="flex justify-between items-center pt-2 border-t border-blue-200 mt-2">
                    <span class="text-sm font-bold text-blue-900">Total</span>
                    <span class="text-lg font-extrabold text-blue-700">₹<span id="modal-total">0</span></span>
                </div>
            </div>

            <form action="/book_test" method="POST" id="booking-form" class="space-y-4">
                <!-- Hidden input to store cart data for the backend -->
                <input type="hidden" name="tests_requested" id="hidden-tests-requested">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Patient Name</label>
                    <input type="text" name="full_name" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">WhatsApp Number</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white font-medium" placeholder="+91">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Collection Address</label>
                    <textarea name="address" rows="2" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white font-medium" placeholder="House No, Area, Yamunanagar"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform flex justify-center items-center mt-4 text-lg">
                    Confirm & Book Collection
                </button>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Test Database (You will eventually fetch this from your database.py)
        const tests = [
            { id: 1, name: "Complete Blood Count (CBC)", price: 300, fasting: "No Fasting", time: "6 hrs" },
            { id: 2, name: "Thyroid Profile (T3, T4, TSH)", price: 450, fasting: "No Fasting", time: "6 hrs" },
            { id: 3, name: "Lipid Profile", price: 500, fasting: "10-12h Fasting", time: "8 hrs" },
            { id: 4, name: "Basic Health Checkup", price: 999, fasting: "10h Fasting", time: "12 hrs" }
        ];

        let cart = [];

        // Render Tests to Screen
        function renderTests() {
            const container = document.getElementById('test-list');
            container.innerHTML = tests.map(test => `
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm relative">
                    <h3 class="font-bold text-gray-900 text-base pr-20">${test.name}</h3>
                    <div class="flex items-center gap-2 mt-1 mb-3">
                        <span class="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${test.fasting}</span>
                        <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded"><i class="fa-solid fa-clock mr-1"></i>${test.time}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-extrabold text-gray-900">₹${test.price}</span>
                        ${getAddButtonHtml(test.id)}
                    </div>
                </div>
            `).join('');
        }

        // Toggle Add/Remove from Cart
        function toggleCart(id) {
            const test = tests.find(t => t.id === id);
            const index = cart.findIndex(item => item.id === id);
            
            if (index > -1) {
                cart.splice(index, 1); // Remove
            } else {
                cart.push(test); // Add
            }
            
            renderTests();
            updateBottomBar();
        }

        // Dynamic Add Button State
        function getAddButtonHtml(id) {
            const inCart = cart.some(item => item.id === id);
            if (inCart) {
                return `<button onclick="toggleCart(${id})" class="text-sm font-bold text-red-500 border border-red-500 bg-red-50 px-4 py-1.5 rounded-lg active:scale-95 transition">Remove</button>`;
            } else {
                return `<button onclick="toggleCart(${id})" class="text-sm font-bold text-blue-600 border border-blue-600 bg-white px-6 py-1.5 rounded-lg active:scale-95 transition">ADD +</button>`;
            }
        }

        // Update Bottom Cart Bar
        function updateBottomBar() {
            const bar = document.getElementById('bottom-bar');
            if (cart.length > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = cart.length;
                
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                document.getElementById('cart-total').innerText = total;
            } else {
                bar.classList.add('hidden');
            }
        }

        // Checkout Modal Logic
        function openCheckout() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const testNames = cart.map(item => item.name).join(', ');

            // Update Modal Data
            document.getElementById('modal-total').innerText = total;
            document.getElementById('modal-cart-items').innerHTML = cart.map(item => `<div class="flex justify-between"><span>${item.name}</span><span>₹${item.price}</span></div>`).join('');
            
            // Pass cart data to backend hidden input
            document.getElementById('hidden-tests-requested').value = testNames;

            // Show UI
            document.getElementById('checkout-overlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('checkout-overlay').classList.remove('opacity-0'), 10);
            document.getElementById('checkout-modal').classList.remove('modal-hidden');
            document.getElementById('checkout-modal').classList.add('modal-visible');
        }

        function closeCheckout() {
            document.getElementById('checkout-overlay').classList.add('opacity-0');
            document.getElementById('checkout-modal').classList.remove('modal-visible');
            document.getElementById('checkout-modal').classList.add('modal-hidden');
            setTimeout(() => document.getElementById('checkout-overlay').classList.add('hidden'), 300);
        }

        // Initialize App
        renderTests();
    </script>
</body>
</html>
