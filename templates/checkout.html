<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Book | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdfa', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' },
                        navy: { 900: '#0b192c', 950: '#060d17' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-16">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/tests" class="text-xs font-bold text-gray-500 hover:text-brand-600 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Back to Catalog
            </a>
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-brand-600 flex items-center justify-center text-white text-xs">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span class="text-base font-black text-navy-900">CareDrop</span>
            </div>
            <div class="text-xs font-semibold text-gray-400">Secure Checkout</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-black text-navy-900 mb-6">Confirm Doorstep Collection</h1>

        <form action="/book_test" method="POST" class="grid grid-cols-1 md:grid-cols-12 gap-8" id="checkout-form">
            
            <!-- Left: Patient Details -->
            <div class="md:col-span-7 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                    <h2 class="text-sm font-bold text-navy-900 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-pen text-brand-600"></i> Patient Details
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                            <input type="text" name="full_name" required placeholder="Patient Legal Name" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp Number</label>
                            <input type="tel" name="phone" required placeholder="10-digit mobile" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Yamunanagar - Jagadhri Address</label>
                            <textarea name="address" rows="3" required placeholder="House No, Landmark, Sector/Colony" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-600 outline-none"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Order Summary & Referral -->
            <div class="md:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                    <h2 class="text-sm font-bold text-navy-900 uppercase tracking-wider mb-4">Order Summary</h2>
                    
                    <div class="divide-y divide-gray-100 mb-4">
                        {% for item in items %}
                        <div class="py-3 flex justify-between items-center text-xs">
                            <span class="font-bold text-navy-900">{{ item.name }}</span>
                            <span class="font-bold text-navy-900">₹{{ item.price|int }}</span>
                        </div>
                        {% endfor %}
                    </div>

                    <!-- Partner Referral Box -->
                    <div class="bg-brand-50 border border-brand-200 rounded-xl p-4 mb-4">
                        <label class="block text-[10px] font-bold text-brand-700 uppercase tracking-wider mb-2">Clinic Referral / Promo Code</label>
                        <div class="flex gap-2">
                            <input type="text" id="promo_input" name="referral_code" placeholder="e.g. CITYMED" class="w-full px-3 py-2 border border-brand-200 rounded-lg text-sm font-bold uppercase focus:outline-none focus:ring-2 focus:ring-brand-600">
                            <button type="button" onclick="applyPromo()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 rounded-lg text-xs font-bold transition shadow-sm">Apply</button>
                        </div>
                        <p id="promo_msg" class="text-[10px] font-semibold mt-2 hidden"></p>
                    </div>

                    <div class="pt-4 border-t border-gray-200 space-y-2 text-xs">
                        <div class="flex justify-between text-gray-500">
                            <span>Subtotal</span>
                            <span id="ui-subtotal" data-value="{{ total }}">₹{{ total|int }}</span>
                        </div>
                        <div class="flex justify-between text-gray-500" id="discount-row" style="display: none;">
                            <span>Partner Discount</span>
                            <span class="text-emerald-600 font-bold" id="ui-discount">-₹0</span>
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                            <span class="text-sm font-bold text-navy-900">Amount to Pay</span>
                            <span class="text-2xl font-black text-brand-700" id="ui-total">₹{{ total|int }}</span>
                        </div>
                        <p class="text-[9px] text-gray-400 text-right uppercase">Pay via Cash/UPI at Collection</p>
                    </div>

                    <!-- T&C Checkbox -->
                    <label class="flex items-start gap-2 mt-6 cursor-pointer">
                        <input type="checkbox" required class="mt-0.5 accent-brand-600">
                        <span class="text-[10px] text-gray-500 leading-tight">I agree to the sample collection terms. I understand processing is done via NABL accredited partner labs.</span>
                    </label>

                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-sm uppercase tracking-wider mt-4 active:scale-95">
                        Confirm Appointment <i class="fa-solid fa-check ml-1"></i>
                    </button>
                </div>
            </div>
        </form>
    </main>

    <script>
        async function applyPromo() {
            const code = document.getElementById('promo_input').value;
            const subtotal = parseFloat(document.getElementById('ui-subtotal').getAttribute('data-value'));
            const msgEl = document.getElementById('promo_msg');
            
            if (!code) return;

            try {
                const res = await fetch('/api/validate_promo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, total: subtotal })
                });
                const data = await res.json();
                
                msgEl.classList.remove('hidden');
                
                if (data.valid) {
                    msgEl.className = 'text-[10px] font-semibold mt-2 text-emerald-600';
                    msgEl.innerHTML = `<i class="fa-solid fa-check-circle"></i> Applied! Discount via ${data.partner}`;
                    
                    document.getElementById('discount-row').style.display = 'flex';
                    document.getElementById('ui-discount').innerText = `-₹${Math.round(data.discount)}`;
                    document.getElementById('ui-total').innerText = `₹${Math.round(data.new_total)}`;
                } else {
                    msgEl.className = 'text-[10px] font-semibold mt-2 text-red-500';
                    msgEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Invalid or expired code.`;
                    
                    document.getElementById('discount-row').style.display = 'none';
                    document.getElementById('ui-total').innerText = `₹${subtotal}`;
                }
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
