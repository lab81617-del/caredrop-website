<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { charcoal: { 900: '#1A2124' }, teal: { 500: '#00ADB5' }, canvas: '#F4F7F6' } } } }</script>
</head>
<body class="bg-canvas text-slate-800 font-sans antialiased min-h-screen">
    <header class="bg-charcoal-900 py-4 px-6 shadow-md"><div class="max-w-xl mx-auto"><a href="/cart" class="text-teal-500 font-bold">← Back to Cart</a></div></header>
    <main class="max-w-xl mx-auto px-4 py-10 w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <h1 class="text-2xl font-extrabold text-charcoal-900 mb-6">Patient Booking Details</h1>
            <form action="/checkout" method="POST" class="space-y-6">
                
                <!-- Multi-Patient Assignment -->
                <div class="space-y-4 border-b border-slate-200 pb-6">
                    <h2 class="text-sm font-bold text-teal-500 uppercase tracking-wider">Who is taking these tests?</h2>
                    {% for test in tests %}
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-1">{{ test['name'] }}</label>
                        <input type="text" name="patient_name_{{ loop.index0 }}" required placeholder="Patient Full Name" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2 text-sm focus:border-teal-500 focus:outline-none">
                    </div>
                    {% endfor %}
                </div>

                <!-- Primary Contact Info -->
                <div class="space-y-4">
                    <h2 class="text-sm font-bold text-teal-500 uppercase tracking-wider">Primary Contact & Location</h2>
                    <input type="tel" name="primary_phone" required placeholder="Primary Mobile Number" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-teal-500">
                    <textarea name="address" required rows="2" placeholder="Complete Home Address" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-teal-500"></textarea>
                    <input type="date" name="date" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-teal-500">
                </div>
                
                <button type="submit" class="w-full py-4 rounded-lg bg-charcoal-900 hover:bg-teal-500 text-white font-bold text-sm uppercase tracking-wider shadow-md transition-colors">Confirm All Bookings</button>
            </form>
        </div>
    </main>
</body>
</html>
