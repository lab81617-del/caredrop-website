<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CareDrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0D9488; --bg-main: #FAFAF9; --card-bg: #FFFFFF; --text-dark: #1C1917; --border: #E7E5E4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-dark); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; font-weight: 700; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        input, select { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 16px; background: var(--primary); color: white; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        .btn-test { background: #F1F5F9; color: #64748B; box-shadow: none; margin-top: 15px; padding: 10px; font-size: 14px; }
        .hidden { display: none; }
        
        .upsell-banner { background: linear-gradient(to right, #FFF7ED, #FFEDD5); border: 1px solid #F97316; padding: 15px; border-radius: 12px; margin-bottom: 25px; display: none; align-items: center; justify-content: space-between; gap:10px; }
        .upsell-text { font-size: 13px; color: #9A3412; font-weight: 700; line-height: 1.4; }
        .btn-upgrade { background: #F97316; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap;}
        
        .summary-box { background: #F0FDF4; border: 1px solid #BBF7D0; padding: 20px; border-radius: 12px; margin-bottom: 25px; text-align: center; }
        .success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;}
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Checkout</h2>

    <!-- Step 1: Contact Section -->
    <div id="contactSection">
        <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="E.g. John Doe" required></div>
        <div class="form-group"><label>Phone Number *</label><input type="tel" id="phone" placeholder="10-digit mobile number" required></div>
        <div class="form-group"><label>Email Address *</label><input type="email" id="email" placeholder="Where should we send your report?" required></div>
        
        <button class="btn" id="btnSendOtp" onclick="sendOtp()">Send OTP & Continue</button>
        
        <!-- Dev Testing Bypass Button -->
        <button class="btn btn-test" onclick="bypassOtp()">[Admin] Skip OTP for Testing</button>
        
        <div id="otpBox" class="hidden" style="margin-top: 20px; background: #F8FAFC; padding: 15px; border-radius: 12px; border: 1px solid #E2E8F0;">
            <div class="form-group"><label>Enter OTP sent to email *</label><input type="text" id="otpCode" placeholder="6-digit code"></div>
            <button class="btn" onclick="verifyOtp()" style="background: #0F172A;">Confirm OTP</button>
        </div>
    </div>

    <!-- Step 2: Booking Details -->
    <div id="bookingSection" class="hidden">
        
        <div class="upsell-banner" id="upsellBanner">
            <div class="upsell-text">💡 Upgrade to "Executive Full Body" for ₹999 and add CBC + LFT to your cart instantly!</div>
            <button class="btn-upgrade">Switch Package</button>
        </div>

        <div class="summary-box">
            <h3 style="color: #166534; margin-bottom: 5px; font-size: 22px;">Total Estimate: ₹<span id="displayTotal">0</span></h3>
            <p style="font-size: 14px; color: #15803D; font-weight: 600;">✅ Pay via Cash or UPI on Collection</p>
        </div>

        <h3 style="margin-bottom: 15px; font-size: 18px; color: #334155; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Patient Details</h3>
        <div class="form-group"><label>Patient Name *</label><input type="text" id="patientName" placeholder="Name of person giving sample" required></div>
        <div class="form-group"><label>Full Home Address *</label><input type="text" id="address" placeholder="House No, Area, Landmark (Yamunanagar)" required></div>
        
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>Collection Date *</label><input type="date" id="date" required></div>
            <div class="form-group" style="flex: 1;">
                <label>Time Slot *</label>
                <select id="timeSlot">
                    <option value="6:00 AM - 8:00 AM">Morning (6AM-8AM)</option>
                    <option value="9:00 AM - 12:00 PM">Late Morning (9AM-12PM)</option>
                    <option value="4:00 PM - 7:00 PM">Evening (4PM-7PM)</option>
                </select>
            </div>
        </div>
        
        <button class="btn" onclick="placeOrder()" style="margin-top: 20px; font-size: 18px; padding: 18px;">Complete Booking</button>
    </div>
</div>

<div id="successModal" class="success-modal hidden">
    <div class="modal-content">
        <h1 style="font-size: 60px; margin-bottom: 10px;">✅</h1>
        <h2 style="font-size: 24px; color: #0F172A;">Booking Confirmed!</h2>
        <p style="margin: 15px 0; color: #4B5563; font-size: 16px; line-height: 1.5;">Your order <b id="orderIdTag" style="color: var(--primary);"></b> has been received. Our rider will arrive at your location.</p>
        <a href="/" class="btn" style="display: inline-block; text-decoration: none;">Return to Home</a>
    </div>
</div>

<script>
    const cart = JSON.parse(sessionStorage.getItem('caredrop_cart') || '[]');
    if(cart.length === 0) { alert("Cart is empty!"); window.location.href = '/tests'; }
    
    let total = 0; cart.forEach(item => total += parseFloat(item.currentPrice));
    document.getElementById('displayTotal').innerText = total.toFixed(2);

    if(cart.length >= 2) document.getElementById('upsellBanner').style.display = 'flex';

    document.getElementById('name').addEventListener('input', (e) => document.getElementById('patientName').value = e.target.value);

    // TEST MODE BYPASS function
    function bypassOtp() {
        document.getElementById('contactSection').style.display = 'none';
        document.getElementById('bookingSection').classList.remove('hidden');
    }

    async function sendOtp() {
        const email = document.getElementById('email').value;
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        
        if(!name || !phone || !email) return alert("❌ Please fill in your Name, Phone, and Email.");
        
        document.getElementById('btnSendOtp').innerText = "Sending OTP...";
        
        try {
            const res = await fetch('/api/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email}) });
            const data = await res.json();
            if(data.success) {
                document.getElementById('btnSendOtp').style.display = 'none';
                document.getElementById('otpBox').classList.remove('hidden');
            } else alert("Error sending OTP");
        } catch(e) {
            alert("Server Error! If email isn't set up yet, use the 'Skip OTP' button for now.");
            document.getElementById('btnSendOtp').innerText = "Send OTP & Continue";
        }
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpCode').value;
        const email = document.getElementById('email').value;
        if(!otp) return alert("❌ Please enter the OTP.");
        
        const res = await fetch('/api/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, otp}) });
        const data = await res.json();
        
        if(data.success) {
            document.getElementById('contactSection').style.display = 'none';
            document.getElementById('bookingSection').classList.remove('hidden');
        } else alert("❌ Invalid OTP.");
    }

    async function placeOrder() {
        const pName = document.getElementById('patientName').value;
        const addr = document.getElementById('address').value;
        const d = document.getElementById('date').value;
        
        if(!pName || !addr || !d) return alert("❌ Wait! You must fill in the Patient Name, Address, and Date.");

        const orderData = {
            name: document.getElementById('name').value || "Test User", 
            phone: document.getElementById('phone').value || "0000000000", 
            email: document.getElementById('email').value || "test@test.com",
            patient_name: pName, address: addr, date: d, time_slot: document.getElementById('timeSlot').value, total: total, cart: cart
        };

        const res = await fetch('/api/place-order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(orderData) });
        const data = await res.json();

        if(data.success) {
            document.getElementById('orderIdTag').innerText = "#" + data.order_id;
            document.getElementById('successModal').classList.remove('hidden');
            sessionStorage.removeItem('caredrop_cart');
        } else alert("Booking failed: " + data.message);
    }
</script>

</body>
</html>
