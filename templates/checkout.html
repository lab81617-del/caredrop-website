<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CareDrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; margin: 0; padding: 20px; color: #0F172A; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; color: #0D9488; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #475569; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
        .otp-box { background: #F0FDF4; padding: 15px; border-radius: 8px; border: 1px solid #BBF7D0; margin-bottom: 20px; }
        .btn-action { background: #0F172A; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-otp { background: #0D9488; color: white; padding: 10px 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; }
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #F1F5F9; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Secure Checkout</h1>
            <a href="/tests" style="text-decoration: none; color: #64748B; font-weight: 700;">&larr; Back to Catalog</a>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 18px;">1. Order Summary</h2>
            <div id="checkoutItems"></div>
            <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-top: 20px; color: #0D9488;" id="totalContainer">
                <span>Total Amount:</span>
                <span id="checkoutTotal">₹0</span>
            </div>
            <p style="font-size: 13px; color: #64748B; text-align: right;" id="paymentNote">Pay via Cash/UPI on collection.</p>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 18px;">2. Email Verification (Required)</h2>
            <div class="otp-box" id="otpSection">
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="patient@example.com" required>
                </div>
                <button type="button" class="btn-otp" id="sendOtpBtn" onclick="sendOTP()">Send OTP Code</button>
                
                <div id="verifySection" style="display: none; margin-top: 15px;">
                    <div class="input-group">
                        <label>Enter 4-Digit Code from Email</label>
                        <input type="text" id="otpCode" placeholder="1234">
                    </div>
                    <button type="button" class="btn-otp" style="background: #0F172A;" onclick="verifyOTP()">Verify Email</button>
                </div>
            </div>
            <div id="emailVerifiedMsg" style="display: none; color: #166534; font-weight: 700; background: #DCFCE7; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                ✅ Email Verified Successfully.
            </div>

            <h2 style="font-size: 18px;">3. Patient & Address Details</h2>
            <form id="orderForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Booked By (Your Name)</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="input-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="phone" required pattern="[0-9]{10}">
                    </div>
                    <div class="input-group">
                        <label>Patient Full Name</label>
                        <input type="text" id="patientName" required>
                    </div>
                    <div class="input-group">
                        <label>Collection Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                
                <div class="input-group" style="margin-bottom: 20px;">
                    <label>Preferred Time Slot</label>
                    <select id="timeSlot" required>
                        <option value="6:00 AM - 8:00 AM">6:00 AM - 8:00 AM (Fasting)</option>
                        <option value="9:00 AM - 12:00 PM">9:00 AM - 12:00 PM</option>
                        <option value="4:00 PM - 7:00 PM">4:00 PM - 7:00 PM</option>
                    </select>
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <label>Complete Home Address</label>
                    <input type="text" id="address" placeholder="House No, Area, Landmark" required>
                </div>
                
                <div class="input-group" style="margin-bottom: 30px; background: #F8FAFC; padding: 15px; border-radius: 8px; border: 1px dashed #CBD5E1;" id="uploadBox">
                    <label>Upload Doctor's Prescription <span id="uploadRequiredText">(Optional)</span></label>
                    <input type="file" id="prescription" accept="image/*,.pdf" style="border: none; padding: 0;">
                </div>

                <button type="submit" class="btn-action" id="submitBtn">Confirm Booking & Pay Later</button>
            </form>
        </div>
    </div>

    <script>
        let isEmailVerified = false;
        let cart = JSON.parse(sessionStorage.getItem('caredrop_cart') || '[]');
        let total = 0;
        
        const urlParams = new URLSearchParams(window.location.search);
        const isDirectUpload = urlParams.get('direct');

        // Render Cart or Prescription Banner
        const container = document.getElementById('checkoutItems');
        if(cart.length === 0) {
            if (isDirectUpload) {
                container.innerHTML = '<div style="background: #F0FDF4; color: #166534; padding: 15px; border-radius: 8px; font-weight: 700; border: 1px dashed #22C55E; text-align: center;">📄 Direct Prescription Upload Mode<br><span style="font-size: 13px; font-weight: 600;">Please attach your prescription below. Our support team will contact you shortly to confirm total costs and timings.</span></div>';
                document.getElementById('totalContainer').style.display = 'none';
                document.getElementById('paymentNote').style.display = 'none';
                
                // Highlight the upload box
                const uploadBox = document.getElementById('uploadBox');
                uploadBox.style.background = '#FEF2F2';
                uploadBox.style.borderColor = '#EF4444';
                document.getElementById('uploadRequiredText').innerText = "(REQUIRED)";
                document.getElementById('uploadRequiredText').style.color = '#EF4444';
                
            } else {
                container.innerHTML = '<p style="color:#64748B;">Your cart is empty. Go back to the catalog to add tests, or upload a prescription below.</p>';
                document.getElementById('totalContainer').style.display = 'none';
            }
        } else {
            cart.forEach(item => {
                total += parseFloat(item.currentPrice);
                container.innerHTML += `
                    <div class="cart-item">
                        <div><div style="font-weight:700;">${item.name}</div><div style="font-size:12px; color:#64748B;">${item.labName}</div></div>
                        <div style="font-weight:800; color:#0D9488;">₹${item.currentPrice}</div>
                    </div>`;
            });
            document.getElementById('checkoutTotal').innerText = `₹${total}`;
        }

        // Set Date minimum to today
        document.getElementById('date').min = new Date().toISOString().split("T")[0];

        // OTP Logic
        function sendOTP() {
            const email = document.getElementById('email').value;
            if(!email) return alert("Enter an email first.");
            
            document.getElementById('sendOtpBtn').innerText = "Sending...";
            
            fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    document.getElementById('sendOtpBtn').style.display = 'none';
                    document.getElementById('verifySection').style.display = 'block';
                    alert("OTP sent to your email!");
                } else {
                    alert(data.message);
                    document.getElementById('sendOtpBtn').innerText = "Send OTP Code";
                }
            });
        }

        function verifyOTP() {
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otpCode').value;
            
            fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, otp: otp})
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    isEmailVerified = true;
                    document.getElementById('otpSection').style.display = 'none';
                    document.getElementById('emailVerifiedMsg').style.display = 'block';
                    document.getElementById('email').disabled = true;
                } else {
                    alert(data.message);
                }
            });
        }

        // Final Submit Logic
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if(!isEmailVerified) return alert("You must verify your email with an OTP before booking.");
            
            const fileInput = document.getElementById('prescription');
            if(cart.length === 0 && fileInput.files.length === 0) {
                return alert("Please select tests from the catalog or upload a prescription file.");
            }

            document.getElementById('submitBtn').innerText = "Processing...";
            document.getElementById('submitBtn').disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('patient_name', document.getElementById('patientName').value);
            formData.append('date', document.getElementById('date').value);
            formData.append('time_slot', document.getElementById('timeSlot').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('total', total);
            formData.append('cart', JSON.stringify(cart));
            
            if(fileInput.files.length > 0) {
                formData.append('prescription', fileInput.files[0]);
            }

            try {
                const response = await fetch('/api/place-order', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if(result.success) {
                    sessionStorage.removeItem('caredrop_cart');
                    alert(`Success! Your Order ID is #${result.order_id}. You will receive a confirmation email.`);
                    window.location.href = '/my-bookings';
                } else {
                    alert('Error: ' + result.message);
                    document.getElementById('submitBtn').innerText = "Confirm Booking & Pay Later";
                    document.getElementById('submitBtn').disabled = false;
                }
            } catch (error) {
                alert("Connection error. Please try again.");
                document.getElementById('submitBtn').innerText = "Confirm Booking & Pay Later";
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
