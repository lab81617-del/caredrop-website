<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CareDrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0D9488; --bg-main: #F8FAFC; --card-bg: #FFFFFF; --text-dark: #0F172A; --border: #E2E8F0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-dark); padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 25px; font-weight: 800; border-bottom: 2px solid var(--border); padding-bottom: 15px; font-size: 24px; color: #334155; }
        
        .section-title { font-size: 16px; font-weight: 700; color: var(--primary); margin: 25px 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 250px; }
        
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #475569; }
        input, select { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s; background: #F8FAFC; }
        input:focus, select:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
        
        .summary-box { background: #F0FDF4; border: 1px solid #BBF7D0; padding: 20px; border-radius: 12px; margin: 25px 0; text-align: center; }
        
        /* Consent Checkbox */
        .consent-label { display: flex; gap: 12px; align-items: flex-start; margin-top: 25px; margin-bottom: 25px; cursor: pointer; background: #F8FAFC; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .consent-label input { width: 22px; height: 22px; margin-top: 2px; cursor: pointer; accent-color: var(--primary); }
        .consent-text { font-size: 13px; color: #475569; line-height: 1.5; font-weight: 500; }
        
        .btn-submit { width: 100%; padding: 18px; background: var(--primary); color: white; font-size: 18px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3); transition: 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4); }
        
        .success-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; padding: 40px; border-radius: 24px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Your Booking</h2>

    <!-- ONE UNIFIED FORM -->
    <form id="checkoutForm">
        
        <!-- SECTION 1: Contact -->
        <div class="section-title">1. Contact Information</div>
        <div class="form-row">
            <div class="form-group"><label>Booking Name *</label><input type="text" id="name" placeholder="E.g. John Doe"></div>
            <div class="form-group"><label>Mobile Number *</label><input type="tel" id="phone" placeholder="10-digit number"></div>
        </div>
        <div class="form-group" style="margin-bottom: 15px;"><label>Email Address *</label><input type="email" id="email" placeholder="For OTP & Digital Reports"></div>

        <!-- SECTION 2: Patient -->
        <div class="section-title">2. Patient Details</div>
        <div class="form-group" style="margin-bottom: 15px;"><label>Patient Full Name *</label><input type="text" id="patientName" placeholder="Name of person providing the sample"></div>
        
        <div class="form-row">
            <div class="form-group"><label>Age *</label><input type="number" id="age" placeholder="Years" min="1" max="120"></div>
            <div class="form-group">
                <label>Gender *</label>
                <select id="gender">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;"><label>Full Home Address (Yamunanagar) *</label><input type="text" id="address" placeholder="House No, Street, Landmark"></div>

        <!-- SECTION 3: Appointment -->
        <div class="section-title">3. Sample Collection Schedule</div>
        <div class="form-row">
            <div class="form-group"><label>Collection Date *</label><input type="date" id="date"></div>
            <div class="form-group">
                <label>Time Slot *</label>
                <select id="timeSlot">
                    <option value="6:00 AM - 8:00 AM">Morning (6:00 AM - 8:00 AM)</option>
                    <option value="9:00 AM - 12:00 PM">Late Morning (9:00 AM - 12:00 PM)</option>
                    <option value="4:00 PM - 7:00 PM">Evening (4:00 PM - 7:00 PM)</option>
                </select>
            </div>
        </div>

        <!-- SUMMARY & CONSENT -->
        <div class="summary-box">
            <h3 style="color: #166534; margin-bottom: 5px; font-size: 22px;">Total Amount: ₹<span id="displayTotal">0</span></h3>
            <p style="font-size: 14px; color: #15803D; font-weight: 600;">✅ Pay via Cash or UPI at your doorstep</p>
        </div>

        <label class="consent-label">
            <input type="checkbox" id="consentBox">
            <span class="consent-text">I consent to IHC Diagnostics collecting my sample. As an expert collection service led by DMLT professionals, I understand my sample will be processed by my chosen NABL-accredited lab.</span>
        </label>
        
        <button type="button" class="btn-submit" id="submitBtn" onclick="placeOrder()">Confirm Booking</button>
    </form>
</div>

<!-- Success Modal -->
<div id="successModal" class="success-modal hidden">
    <div class="modal-content">
        <h1 style="font-size: 60px; margin-bottom: 10px;">✅</h1>
        <h2 style="font-size: 26px; color: #0F172A; margin-bottom: 10px;">Booking Confirmed!</h2>
        <p style="color: #475569; font-size: 16px; line-height: 1.6; margin-bottom: 25px;">Your order <b id="orderIdTag" style="color: var(--primary);"></b> has been received. Our certified DMLT rider will arrive at your location on time.</p>
        <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; font-size: 16px; padding: 14px;">Return to Home</a>
    </div>
</div>

<script>
    const cart = JSON.parse(sessionStorage.getItem('caredrop_cart') || '[]');
    if(cart.length === 0) { alert("Cart is empty!"); window.location.href = '/tests'; }
    
    let total = 0; cart.forEach(item => total += parseFloat(item.currentPrice));
    document.getElementById('displayTotal').innerText = total.toFixed(2);

    // Auto-fill patient name to save user time
    document.getElementById('name').addEventListener('input', (e) => {
        if(!document.getElementById('patientName').value || document.getElementById('patientName').value.length < e.target.value.length) {
            document.getElementById('patientName').value = e.target.value;
        }
    });

    // STRICT JAVASCRIPT VALIDATION
    async function placeOrder() {
        
        // 1. Gather all fields
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const patientName = document.getElementById('patientName').value.trim();
        const age = document.getElementById('age').value.trim();
        const gender = document.getElementById('gender').value;
        const address = document.getElementById('address').value.trim();
        const date = document.getElementById('date').value;
        const timeSlot = document.getElementById('timeSlot').value;
        const consent = document.getElementById('consentBox').checked;

        // 2. The Iron-Clad Lock: If ANYTHING is missing, stop immediately.
        if(!name || !phone || !email || !patientName || !age || !gender || !address || !date) {
            alert("❌ Please fill out every single detail before confirming your booking.");
            return; // Stops the function dead in its tracks
        }
        
        if(!consent) {
            alert("❌ You must check the consent box at the bottom to proceed.");
            return; // Stops the function
        }

        // 3. If it passes validation, proceed to send to database
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const fullPatientDetail = patientName + " (" + age + " Yrs, " + gender + ")";

        const orderData = {
            name: name, 
            phone: phone, 
            email: email,
            patient_name: fullPatientDetail, 
            address: address, 
            date: date, 
            time_slot: timeSlot, 
            total: total, 
            cart: cart
        };

        try {
            const res = await fetch('/api/place-order', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(orderData) 
            });
            const data = await res.json();

            if(data.success) {
                // TRUE SUCCESS (Only happens if the database accepts the order)
                document.getElementById('orderIdTag').innerText = "#" + data.order_id;
                document.getElementById('successModal').classList.remove('hidden');
                sessionStorage.removeItem('caredrop_cart');
            } else {
                alert("Booking failed: " + data.message);
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
            }
        } catch(e) {
            alert("❌ Network Error: Could not connect to the database. Please try again.");
            btn.innerText = "Confirm Booking";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
