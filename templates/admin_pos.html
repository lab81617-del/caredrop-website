<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Booking | CareDrop HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#0d9488' }, navy: { 900: '#0b192c' } } } } }
    </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased pb-20">

    <header class="bg-navy-900 border-b border-slate-800 sticky top-0 z-40 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4">
            <a href="/admin" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="text-base font-black tracking-tight">HQ POS Booking</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <div class="md:col-span-7 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider mb-4"><i class="fa-solid fa-magnifying-glass text-brand-600 mr-2"></i>Search Catalog</h2>
                <input type="text" id="pos-search" onkeyup="filterPosTests()" placeholder="Search test name..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm mb-4 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600">
                
                <div class="max-h-[500px] overflow-y-auto divide-y divide-slate-100 pr-2" id="pos-catalog">
                    {% for t in tests %}
                    <div class="py-3 flex justify-between items-center pos-item" data-name="{{ t.name }}" data-price="{{ t.price }}">
                        <div>
                            <span class="block font-bold text-slate-800 text-sm">{{ t.name }}</span>
                            <span class="text-[10px] text-slate-500 font-mono">Retail: ₹{{ t.price|int }}</span>
                        </div>
                        <button onclick="addToPos('{{ t.name }}', {{ t.price }}, {{ t.id }})" class="bg-slate-100 hover:bg-brand-50 hover:border-brand-200 border border-transparent text-brand-600 px-4 py-2 rounded-lg text-xs font-bold transition">Add to Bill</button>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="md:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-max sticky top-24">
                <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Current Bill</h2>
                
                <div id="pos-cart" class="flex-1 overflow-y-auto space-y-2 mb-4 text-xs font-bold text-slate-700 min-h-[150px]">
                    <div class="text-slate-400 text-center py-8 font-normal" id="empty-cart-msg">No tests added yet.</div>
                </div>
                
                <div class="border-t border-slate-200 pt-4 mb-4 flex justify-between items-center">
                    <span class="text-sm font-black text-slate-900">Total Payable</span>
                    <span class="text-2xl font-black text-brand-700" id="pos-total-display">₹0</span>
                </div>

                <!-- ADDED AGE AND GENDER FOR POS -->
                <form action="/pos_book_test" method="POST" class="space-y-3 text-xs" onsubmit="preparePosForm(event)">
                    <input type="hidden" name="tests_requested" id="pos-tests-input">
                    <input type="hidden" name="total_bill" id="pos-bill-input">
                    
                    <input type="text" name="full_name" required placeholder="Patient Legal Name" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" name="age" required placeholder="Age (Yrs)" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600">
                        <select name="gender" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600 text-slate-500">
                            <option value="" disabled selected>Gender...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="flex gap-2">
                        <input type="tel" name="phone" required placeholder="10-Digit Mobile" class="w-1/2 px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600">
                        <input type="email" name="email" placeholder="Email (For Receipt)" class="w-1/2 px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600">
                    </div>
                    <textarea name="address" rows="2" required placeholder="Collection Address (House, Sector)" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-brand-600"></textarea>
                    
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-4 rounded-xl uppercase tracking-wider transition shadow-md mt-2">Generate Order & Dispatch</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let posCart = [];

        function filterPosTests() {
            const q = document.getElementById('pos-search').value.toLowerCase();
            document.querySelectorAll('.pos-item').forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                item.style.display = name.includes(q) ? 'flex' : 'none';
            });
        }

        function addToPos(name, price, id) {
            posCart.push({name, price, id});
            renderPosCart();
        }

        function removeFromPos(index) {
            posCart.splice(index, 1);
            renderPosCart();
        }

        function renderPosCart() {
            const cartDiv = document.getElementById('pos-cart');
            const totalDisplay = document.getElementById('pos-total-display');
            const msg = document.getElementById('empty-cart-msg');
            
            if(posCart.length === 0) {
                cartDiv.innerHTML = '';
                cartDiv.appendChild(msg);
                msg.style.display = 'block';
                totalDisplay.innerText = '₹0';
                return;
            }
            
            msg.style.display = 'none';
            cartDiv.innerHTML = '';
            let total = 0;
            
            posCart.forEach((item, index) => {
                total += parseFloat(item.price);
                cartDiv.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                        <span class="text-slate-800">${item.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="font-black text-navy-900">₹${item.price}</span>
                            <button type="button" onclick="removeFromPos(${index})" class="text-red-400 hover:text-red-600 bg-red-50 w-6 h-6 rounded flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                `;
            });
            totalDisplay.innerText = `₹${total}`;
        }

        function preparePosForm(e) {
            if(posCart.length === 0) {
                e.preventDefault();
                alert("Please add tests to the bill before dispatching.");
                return false;
            }
            document.getElementById('pos-tests-input').value = posCart.map(t => t.name).join(', ');
            document.getElementById('pos-bill-input').value = posCart.reduce((sum, t) => sum + parseFloat(t.price), 0);
        }
    </script>
</body>
</html>
