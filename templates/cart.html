<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | CareDrop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { charcoal: { 800: '#2C3539', 900: '#1A2124' }, teal: { 500: '#00ADB5' }, canvas: '#F4F7F6' } } } }</script>
</head>
<body class="bg-canvas text-charcoal-800 font-sans antialiased min-h-screen">
    <header class="bg-charcoal-900 text-white py-4 px-6 shadow-md"><div class="max-w-4xl mx-auto font-bold"><a href="/" class="text-teal-500">← Back to Lab</a></div></header>
    <main class="max-w-4xl mx-auto px-4 py-10 w-full">
        <h1 class="text-3xl font-extrabold text-charcoal-900 mb-6">Your Cart</h1>
        {% if tests %}
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            {% for test in tests %}
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                    <h3 class="font-bold text-charcoal-900">{{ test['name'] }}</h3>
                    <p class="text-xs text-slate-500">Fasting: {{ test['fasting_required'] }}</p>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="font-extrabold">₹{{ test['price'] }}</span>
                    <a href="/cart/remove/{{ test['id'] }}" class="text-red-500 text-sm font-bold hover:underline">Remove</a>
                </div>
            </div>
            {% endfor %}
            <div class="flex justify-between items-center pt-4 text-xl font-black">
                <span>Total:</span><span class="text-teal-600">₹{{ total }}</span>
            </div>
        </div>
        <a href="/checkout" class="block w-full text-center mt-6 py-4 rounded-lg bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm uppercase tracking-wider shadow-md">Proceed to Checkout</a>
        {% else %}
        <div class="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center text-slate-500 font-bold">Your cart is empty.</div>
        {% endif %}
    </main>
</body>
</html>
